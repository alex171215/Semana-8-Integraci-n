services:
  - type: web
    name: semana-8-kong-bff-suite
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCTOS_PORT
        value: "3000"
      - key: BFF_PORT
        value: "3001"
